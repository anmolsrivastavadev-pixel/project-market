<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Bangerkit</title>
  <!-- "Scanline tear": a pixel X on a black tile drawn as scanlines (every other row empty), one line
       torn right and one left, so the X also reads as rising bars. Rising stroke in brand pink
       #f27c9b, falling stroke in sand #f4efe6. 20-cell grid: sharpest at 20, 40, 80 px. -->
  <defs><clipPath id="tile"><rect width="20" height="20" rx="3.75"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="20" height="20" fill="#0a0a0a"/>
    <rect x="3" y="4" width="4" height="1" fill="#f4efe6"/>
    <rect x="13" y="4" width="4" height="1" fill="#f27c9b"/>
    <rect x="4" y="6" width="5" height="1" fill="#f4efe6"/>
    <rect x="11" y="6" width="5" height="1" fill="#f27c9b"/>
    <rect x="8" y="8" width="3" height="1" fill="#f4efe6"/>
    <rect x="11" y="8" width="5" height="1" fill="#f27c9b"/>
    <rect x="7" y="10" width="5" height="1" fill="#f27c9b"/>
    <rect x="12" y="10" width="1" height="1" fill="#f4efe6"/>
    <rect x="4" y="12" width="5" height="1" fill="#f27c9b"/>
    <rect x="9" y="12" width="5" height="1" fill="#f4efe6"/>
    <rect x="3" y="14" width="5" height="1" fill="#f27c9b"/>
    <rect x="12" y="14" width="5" height="1" fill="#f4efe6"/>
    <rect x="3" y="16" width="3" height="1" fill="#f27c9b"/>
    <rect x="14" y="16" width="3" height="1" fill="#f4efe6"/>
  </g>
</svg>
